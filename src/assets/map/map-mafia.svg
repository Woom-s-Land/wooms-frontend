<svg xmlns="http://www.w3.org/2000/svg" width="128" height="116" viewBox="0 0 128 116" shape-rendering="crispEdges" font-family="'Pretendard','Noto Sans KR',sans-serif">
  <!-- ground shadow -->
  <ellipse cx="64" cy="110" rx="46" ry="6" fill="#000000" opacity="0.12"/>

  <!-- roof (mysterious navy/plum) -->
  <polygon points="14,30 64,8 114,30" fill="#3b2a4a"/>
  <polygon points="20,30 64,12 108,30" fill="#5a4470"/>
  <g fill="#3b2a4a" opacity="0.6">
    <rect x="40" y="20" width="4" height="2"/>
    <rect x="64" y="15" width="4" height="2"/>
    <rect x="86" y="22" width="4" height="2"/>
  </g>
  <rect x="14" y="30" width="100" height="6" fill="#2c2036"/>

  <!-- signboard -->
  <rect x="34" y="34" width="60" height="18" fill="#F8E4C8" stroke="#3b2a4a" stroke-width="2"/>
  <text x="64" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b2a4a">그림마피아</text>

  <!-- walls -->
  <rect x="20" y="52" width="88" height="52" fill="#EFE3CF"/>
  <rect x="20" y="52" width="88" height="52" fill="none" stroke="#8a7a64" stroke-width="2"/>
  <rect x="20" y="52" width="4" height="52" fill="#8a7a64"/>
  <rect x="104" y="52" width="4" height="52" fill="#8a7a64"/>

  <!-- left window: detective mask -->
  <rect x="28" y="60" width="26" height="26" fill="#cdbfe0" stroke="#3b2a4a" stroke-width="2"/>
  <path d="M33 70 q8 -6 16 0 q0 8 -8 10 q-8 -2 -8 -10 z" fill="#2c2036"/>
  <rect x="36" y="72" width="4" height="3" fill="#F8E4C8"/>
  <rect x="42" y="72" width="4" height="3" fill="#F8E4C8"/>

  <!-- center door -->
  <rect x="58" y="68" width="20" height="36" fill="#5a4470" stroke="#2c2036" stroke-width="2"/>
  <rect x="62" y="72" width="12" height="14" fill="#7a648f"/>
  <circle cx="74" cy="88" r="1.6" fill="#F2C14E"/>

  <!-- right window: magnifying glass over a question mark -->
  <rect x="82" y="60" width="22" height="26" fill="#cdbfe0" stroke="#3b2a4a" stroke-width="2"/>
  <text x="90" y="78" font-size="14" font-weight="bold" fill="#3b2a4a">?</text>
  <circle cx="96" cy="70" r="6" fill="none" stroke="#2c2036" stroke-width="2"/>
  <line x1="100" y1="74" x2="103" y2="78" stroke="#2c2036" stroke-width="2"/>

  <!-- base / step -->
  <rect x="16" y="104" width="96" height="6" fill="#8a7a64"/>
  <rect x="16" y="104" width="96" height="2" fill="#a8987a"/>
</svg>
